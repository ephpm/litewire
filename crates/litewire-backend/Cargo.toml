[package]
name = "litewire-backend"
description = "Backend trait and implementations for litewire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
parking_lot = { workspace = true }
# Statement classification for write admission control (hrana-client only).
# `litewire-translate` depends on no other workspace crate, so this does not
# create a cycle.
litewire-translate = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
litewire-hrana = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true }

[features]
default = ["rusqlite"]
rusqlite = ["dep:rusqlite", "dep:regex"]
hrana-client = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:base64",
    "dep:litewire-translate",
]
