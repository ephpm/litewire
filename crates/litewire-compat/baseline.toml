# litewire MySQL/PG wire-compatibility baseline.
#
# Each row is a corpus entry known NOT to pass fully: an
# unsupported construct or a documented MySQL/PG-vs-SQLite
# divergence. The suite fails the build on any FAILING entry whose
# id is absent here (a regression or an un-triaged new entry).
#
# Regenerate deliberately with COMPAT_UPDATE_BASELINE=1 (see the
# crate README) and review every added/removed row. The generated
# `reason` is prefixed `observed:`; replace it with a real
# explanation (as below) when you triage a new row.

# NOTE: `mysql/cte/simple` and `pg/cte/simple` were previously baselined here
# as an exec_error ("unexpected row during execution"), attributed to a Turso
# CTE engine bug. That attribution was wrong: the error was litewire#38 — a
# `WITH … SELECT` leads with `WITH`, so `classify()` mis-routed it to the
# backend's `execute()` path, which errors on any statement that yields a row.
# With #38 fixed they route to `query()` and pass, so their baseline rows are
# removed (the corpus now gates them as must-pass).

[[entry]]
id = "mysql/expr/integer_division"
kind = "result_mismatch"
reason = "Dialect semantics: MySQL `/` is floating-point division (7/2 = 3.5); SQLite/Turso (and PostgreSQL) do integer division on integer operands (3). Expected divergence, not a litewire defect."
