name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Non-default features are not reachable from the run above, and the
      # gap was real: `backend-hrana-client` is off by default, so
      # `hrana_client.rs` -- the entire sqld path for embedders -- was never
      # compiled by CI. Its unit tests had been failing to compile, and four
      # `approx_constant` denials were sitting in feature-gated test code.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-version = "1.88" is declared in Cargo.toml; this job is what
      # makes that declaration true. (1.85 was declared for a while but was
      # never verified and never true with the locked dependency graph --
      # the turso engine's `aristo` dependency requires rustc 1.88.)
      # cargo check (not test) keeps it cheap -- the goal is "compiles on
      # the MSRV", the stable jobs own correctness.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Both runs are kept: feature unification under --all-features can
      # mask a break that only shows with default features, and the default
      # run alone misses every optional backend (hrana-client, turso).
      - run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory (RustSec), license, ban, and source audit. The ignore list
      # in deny.toml documents every accepted advisory with the reason and
      # the condition for dropping it -- never add an ID without a comment.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
